[project]
name = "football-intelligence-lab"
version = "0.1.0"
description = "Football match and event data intelligence lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arviz>=0.23.4",
    "catboost>=1.2.10",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "lightgbm>=4.7.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pymc>=5.28.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "uvicorn>=0.52.3",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_intelligence"]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pre-commit>=4.3",
    "jupyterlab>=4.4",
    "ipykernel>=6.30",
    "numpy>=2.5.2",
    "matplotlib>=3.11.1",
    "pandas-stubs>=3.0.5.260730",
    "scipy-stubs>=1.18.0.1",
    "httpx>=0.28.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Ruff formats fenced code blocks inside Markdown; CLAUDE.md/TASKS.md are
# hand-written specifications whose snippets must stay verbatim.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "ANN",    # flake8-annotations
    "PTH",    # flake8-use-pathlib
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=football_intelligence",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["src/football_intelligence"]
branch = true

[[tool.mypy.overrides]]
# statsmodels ships no type information and has no stubs package. The import is
# confined to welch_anova, whose result is immediately converted to floats.
module = ["statsmodels.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scikit-learn ships no type information either. Everything it returns is
# converted to a concrete type at the boundary of the model and metric modules.
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# joblib is used only to serialise fitted sklearn pipelines.
module = ["joblib"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# CatBoost ships no type information and has no stubs package.
module = ["catboost", "catboost.*"]
ignore_missing_imports = true
